# 菜单标题.
title: '刷怪笼升级'

# 菜单布局.
pattern:
  - '@ # & $ $ $ $ $ $'
  - '# & $ $ $ $ $ $ $'
  - '& $ $ ! $ ^ $ $ &'
  - '$ $ $ $ $ $ $ & #'
  - '$ $ $ $ $ $ & # @'

# 玩家成功升级刷怪笼时播放的音效.
success-sound:
  type: ENTITY_EXPERIENCE_ORB_PICKUP
  volume: 0.2
  pitch: 0.2

# 玩家升级刷怪笼失败时播放的音效.
failure-sound:
  type: BLOCK_ANVIL_PLACE
  volume: 0.2
  pitch: 0.2

current-upgrade: '!'
next-upgrade: '^'

# 菜单物品
items:
  '@':
    type: BLACK_STAINED_GLASS_PANE
    name: '&f'
  '#':
    type: YELLOW_STAINED_GLASS_PANE
    name: '&f'
  '&':
    type: ORANGE_STAINED_GLASS_PANE
    name: '&f'
  '!':
    type: BARRIER
    name: '&c不可升级'
    lore:
      - '&7你不能再给这个刷怪笼升级了.'
  '^':
    type: BARRIER
    name: '&c不可升级'
    lore:
      - '&7你不能再给这个刷怪笼升级了.'