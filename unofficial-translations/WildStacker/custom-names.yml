# 是否启用该特性?
enabled: true

# 在这里你可以指定实体或物品的特殊种类
# 添加时请按照 "物品种类: 自定义名称", "'物品种类:物品数据值': 自定义名称" 和 "实体种类: 自定义名称" 的格式.
# {0} 会在名称非空时返回物品的名称

'INK_SACK:15': '骨粉'
MOB_SPAWNER: '{0}'
PIG: '猪'
