# ╔══════════════════════════════════════════════════════════════════════════╗
# ║                      FakePlayerPlugin - secrets.yml                      ║
# ║                            AI API 密钥 & 秘密设置                        ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# 这个文件包含了敏感的 API 密钥及 AI 驱动的机器人对话。
# 请勿公开此文件，或将其传入版本更迭中。
#
# ── AI 提供方 API 密钥 ──────────────────────────────────────────────────────
# 留空表示不启用。
# 只需配置一个提供方 — 机器人优先使用首个可用的密钥。
#
# 模型选择：
# - “model” 设置留空表示随机选择提供方的可用模型
# - 指定模型名称（如“gpt-4”、“claude-3-opus-20240229”）使用对应模型

# OpenAI (ChatGPT) API
# 密钥获取连接：https://platform.openai.com/api-keys
# 可用模型：gpt-4-turbo, gpt-4, gpt-3.5-turbo
openai:
  api-key: ""
  model: ""
  # 可选：自定义退出点（留空表示默认）
  endpoint: ""

# 微软 Copilot API (Azure OpenAI)
# 密钥获取连接：https://portal.azure.com
copilot:
  api-key: ""
  model: ""
  endpoint: ""
  deployment-name: ""

# Groq API（快速接口）
# 密钥获取连接：https://console.groq.com/keys
# 可用模型：mixtral-8x7b-32768, llama2-70b-4096
groq:
  api-key: ""
  model: ""
  # 可选：自定义退出点
  endpoint: ""

# Anthropic Claude API
# 密钥获取连接：https://console.anthropic.com/
# 可用模型：claude-3-opus-20240229, claude-3-sonnet-20240229, claude-3-haiku-20240307
anthropic:
  api-key: ""
  model: ""
  endpoint: ""

# Google Gemini API
# 密钥获取连接：https://makersuite.google.com/app/apikey
# 可用模型：gemini-pro, gemini-pro-vision
google:
  api-key: ""
  model: ""
  endpoint: ""

# Ollama（本地/自托管）
# 无需 API — 将退出点指向你的 Ollama 服务器即可
# 留空表示随机从服务器上的可用模型选择
ollama:
  enabled: false
  endpoint: "http://localhost:11434"
  model: ""

# 自定义 OpenAI 兼容的 API
# 适用于任意实现了 OpenAI API 格式的服务
custom:
  enabled: false
  api-key: ""
  model: ""
  endpoint: ""

