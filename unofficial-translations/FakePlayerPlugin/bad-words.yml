#  这个配置可以分服务器配置不同的违规词，且支持正则表达式。
#  默认的远程违禁词链接为：
#    https://www.cs.cmu.edu/~biglou/resources/bad-words.txt
#
#  匹配规则：
#    · 忽略大小写，部分包含匹配   （即“词汇”作为违规词也会阻止“一个词汇”之类的词语）
#    · 形状类似的字符             （如用“5”或“$”代替“s”，或者在词汇间插入下划线都不能绕过检测）
#    · 自动检测模式附加：          正则表达式匹配重复/分隔
#    · 可选自定义正则：            只需在 patterns: 列表中自行添加即可
#
#  输入命令 /fpp reload 即可无需重启服务器应用改动。
# ─────────────────────────────────────────────────────────────────────────────

