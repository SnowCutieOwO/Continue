# ─────────────────────────────────────────────────────────────────────────────
#  ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ ᴘʟᴜɢɪɴ  ·  config.yml  ·  v1.6.2
#  输入命令 /fpp reload 即可无需重启应用大部分改动
#  颜色为 MiniMessage 格式：<#0079FF>text</#0079FF> 或 <gray>text</gray>
# ─────────────────────────────────────────────────────────────────────────────

# 内部设置 — 自动更新。请勿修改。
config-version: 70
language: en

# ═════════════════════════════════════════════════════════════════════════════
#  1 · 生成
# ═════════════════════════════════════════════════════════════════════════════

# ── 假人数量限制 ────────────────────────────────────────────────────────────────
limits:
  max-bots: 1000 # 所有玩家可生成的假人数量上限。 0 = 数量不限。
  user-bot-limit: 1 # 单个玩家可以使用 fpp.user.spawn 命令生成的假人数量上限
  spawn-presets:
  - 1
  - 5
  - 10
  - 15
  - 20

# 每次 /fpp spawn 命令的冷却时间
# 0 = 不设置冷却。拥有 fpp.bypass.cooldown 权限的玩家可以无视冷却。
spawn-cooldown: 0

# ── 持续 ───────────────────────────────────────────────────────────────
# 假人会在关服时记住自己的位置，且会在服务器重启后重新回到对应位置。
# 正在进行的任务（挖掘/放置/巡逻）也会通过数据库保存。
persistence:
  enabled: true

# ── 加入 & 退出延迟 ───────────────────────────────────────────────────────
# 随机间隔地加入或退出，使得假人看起俩更自然。
# 单位为刻 — 20 刻 = 1 秒。
# 快速参考：0 = 立即 · 20 = 1 秒 · 40 = 2 秒 · 100 = 5 秒
join-delay:
  min: 0 # 单位为刻
  max: 1 # 单位为刻

leave-delay:
  min: 0 # 单位为刻
  max: 1 # 单位为刻


# ═════════════════════════════════════════════════════════════════════════════
#  2 · 外观
# ═════════════════════════════════════════════════════════════════════════════

# ── 显示名称 ─────────────────────────────────────────────────────────────
# 可用变量：{bot_name}  {spawner}  {num}
# 颜色格式：<#0079FF>{bot_name}</#0079FF> 或 <gray>{bot_name}</gray>
bot-name:
  # 自动生成假人名称的来源（无 --name 参数的情况下）。
  #   pool   — 从 bot-names.yml（需要文件中预先填入名称）中选择
  #   random — 随机生成 Minecraft 风格的玩家名称（默认）
  mode: random
  
  admin-format: '{bot_name}' # 用于 /fpp spawn（管理员）生成的假人名称
  user-format: bot-{spawner}-{num} # 用于 /fpp spawn（玩家）生成的假人名称

# ── 皮肤 ─────────────────────────────────────────────────────────────────────
# mode: player — 通过名称复制/获取玩家的皮肤（兼容旧版：自动）
# mode: random — 从皮肤池及 skins/ 文件夹下获取并覆盖（兼容旧版：自定义）
# mode: none   — 无自定义皮肤。所有假人都使用默认的史蒂夫/艾利克斯皮肤
skin:
  mode: player
  guaranteed-skin: true # true = 无法解析名称获取皮肤的假人使用默认皮肤
  clear-cache-on-reload: true
  
  # ── 仅随机模式 ──────────────────────────────────────────────────────
  overrides: {}
  pool: []
  use-skin-folder: true # 扫描 plugins/FakePlayerPlugin/skins/ 获取 png 格式的图片

# ── Tab 列表 ──────────────────────────────────────────────────────────────────
# true  = 假人会显示在玩家列表中（默认设置）
# false = 假人不会显示在玩家列表中（仍然会显示在服务器总玩家数中）
tab-list:
  enabled: true

# ── 延迟模拟 ─────────────────────────────────────────────────────────
# 使得假人在 TAB 列表中像真实玩家一样拥有延迟。
# 每个假人会在一定时间段内获得随机延迟，以此模拟真实玩家在线的样子。
# NMS 延迟及 TAB 列表的延迟图标会同步更新，因此服务器侧的 API（例如 player.getPing()）
# 会正确返回模拟的值。
ping:
  enabled: false # 让所有假人拥有仿真延迟。
  min: 20 # 基础延迟最低值（单位为毫秒）
  max: 200 # 基础延迟最高值（单位为毫秒）
  variability: 8 # 每次循环的数字抖动（单位为毫秒）
  update-interval: 40 # 延迟波动的更新间隔（40 刻 = 2 秒）
  latency-effect: true # 使假人的聊天消息与自身延迟保持同步
  # 模仿真实的网络卡顿。延迟较高的假人
  # 会在发送消息时停顿更久。
  spike-chance: 0.04 # 每次刻循环出现随机延迟高峰的几率（0-1）。
  spike-min: 200 # 延迟高峰的最小值（单位为毫秒）
  spike-max: 600 # 延迟高峰的最大值（单位为毫秒）
  join-ramp-ticks: 60 # 假人生成开始从 1 变化到正常延迟所用的时间（设置为 0 表示关闭）。

# ── 服务器列表（MOTD 显示） ────────────────────────────────────────────────────
# 决定假人如何影响服务器列表 / MOTD 中的显示。
server-list:
  count-bots: true # true  = 假人会算在 MOTD 的玩家计数中
                   # false = 只算入真实玩家
  include-remote-bots: false # true  = 将其他网络模式的假人合并计算至服务器的显示数量（适用于大厅）

# ── LuckPerms ─────────────────────────────────────────────────────────────────
# 假人是真实的 NMS ServerPlayer 实体 — LuckPerms 可以处理它们。
# 前缀、后缀及 TAB 列表排序会自动生效。
luckperms:
  default-group: '' # 生成时假人进入的权限组。留空表示进入默认组。
                    # 可通过命令“/fpp rank <假人名称> <所在组别>”单独修改假人所在的权限组。

# ── 违规词过滤 ────────────────────────────────────────────────────────────
# 防止玩家向假人名称中填入违规词。
# 匹配规则无视大小写，且为部分判定（例如当“hell”为违规词时，“hellish”同样视作屏蔽词）。
# 白名单中的名称可以忽略黑名单规则。
badword-filter:
  enabled: true # true = 启用违规词过滤；false = 不限制假人名称
  use-global-list: false # true = 从下方地址获取违规词列表
  global-list-url: https://www.cs.cmu.edu/~biglou/resources/bad-words.txt
  global-list-timeout-ms: 5000 # 远程列表获取超时的时间（启动 / 重载时开始计数）
  words: []
  whitelist: []
  auto-rename: true # true  = 违规名称会替换为 bot-names.yml 中选择的随机名称。
                    # false = 阻止带有违规名称的假人生成
  
  # ── 自动检测 ────────────────────────────────────────────────────────
  # 增强检测违规词的功能，
  # 使得字符插入及形状相似的字也可以被检测，同时增加了正则表达式过滤。
  #
  # 对应模式的解释：
  #   off      — 只检测一般相似字符：0→o  1→i  3→e  4→a  5→s  6→g  7→t  8→b  _→空格或无
  #   normal   — 检测一般相似字符、重复字符，启用正则表达式检测
  #   strict   — 在上一个模式基础上增加单间隙字符检测。
  #              可以过滤诸如“fXuXcXk”、“n1i1g1g1e1r”这样的违禁词。
  #
  # 提升检测严格程度可能会增加普通假人名称的误判。
  auto-detection:
    enabled: true # true  = 是否启用强化名称自动检测
    mode: normal # off | normal | strict

# ── 假人交互 ───────────────────────────────────────────────────────────
# 决定玩家如何与世界中的假人进行交互。
bot-interaction:
  right-click-enabled: true # true = 右键点击可以打开背包或执行命令
                            # false = 假人会忽略所有右键点击交互
  shift-right-click-settings: true # true = shift+右键点击打开假人设置界面
                                   # false = shift+右键点击不触发动作

# ── 消息 ──────────────────────────────────────────────────────────────────
messages:
  join-message: true # 公告提示“<假人名称> 加入了游戏”
  leave-message: true # 公告提示“<假人名称> 离开了游戏”
  death-message: true # 假人被击杀时发送“X 被 Y 杀死了”提示
  kill-message: false # 玩家击杀假人时发送提示
  notify-admins-on-join: true # 向加入的管理员发送兼容性警告提示


# ═════════════════════════════════════════════════════════════════════════════
#  3 · 实体 & 战斗
# ═════════════════════════════════════════════════════════════════════════════

# ── 假人实体 ──────────────────────────────────────────────────────────────────
# 出现在世界中的假人。
body:
  enabled: true # false = 只计入 TAB 列表或玩家计数，不在世界中产生实体。
  pushable: true # true = 玩家与爆炸可以推动实体。
  damageable: true # true = 实体可以受到玩家能受到的任何伤害
                   # false = 只免疫玩家/实体伤害（无法忽略坠落、着火等伤害）
  pick-up-items: true # true = 是否像普通玩家那样能够拾取物品
  pick-up-xp: true # true = 是否像普通玩家那样能够拾取经验球
  drop-items-on-despawn: false # false = 假人消失/重新生成时保留背包与经验值；true = 消失时将所有物品生成在地面

# ── 战斗 ────────────────────────────────────────────────────────────────────
combat:
  max-health: 20.0 # 假人的最大生命值。20.0 = 普通玩家（2 生命值 = 1 心）
  hurt-sound: true # 假人受伤时是否发出玩家受伤的音效。

# ── 死亡 & 复活 ───────────────────────────────────────────────────────────
death:
  respawn-on-death: false # true = 死亡后复活在假人生成的位置
  respawn-delay: 15 # 复活的时间间隔，单位为刻（20 刻 = 1 秒 · 60 刻 = 3 秒 · 100 刻 = 5 秒）
  suppress-drops: false # false = 假人会像真实玩家一样掉落所有物品与经验值；true = 不掉落任何东西

# ── 区块加载 ─────────────────────────────────────────────────────────────
# 假人可以像真实玩家一样保持某些区块的加载状态。
# 只有被加载的区块才可以生成生物、正常触发红石电路以及让作物生长。
chunk-loading:
  enabled: true
  radius: auto # 每个假人能够保持载入的区块范围：
               #   "auto" = 自动跟随服务器的模拟距离（推荐）
               #      0   = 禁止假人加载区块（禁止假人的区块范围加载）
               #   正整数 = 固定半径之内的区块（例如 4、6 或者 10）
  update-interval: 20 # 位置检查的间隔，单位为刻。20 刻 = 1 秒。
                      # 值越低 = 检查越频繁，值越高 = 检查次数越少。
  mass-disable-threshold: 100 # 0 = 从不自动禁用。当活跃的假人到达这个数量时，
                              # 插件会减少区块载入量以防假人过多占用服务器性能。
# 不过寻路功能仍然可以正常规划途径卸载区块的路线。

# ── 自动化默认设置 ───────────────────────────────────────────────────────
# 对新生成假人的默认设置。已存在的假人不会改变任何设置。
automation:
  auto-eat: true # 当饥饿值低到无法疾跑时，假人会自动消耗背包中的食物。
  auto-place-bed: true # 假人是否自动放置床，自动睡觉，并在醒来之后将床收起。
  auto-milk: true # 假人是否自动饮用牛奶解除负面效果（中毒、凋零等效果）
  prevent-bad-omen: true # 阻止假人受到不祥之兆、劫掠之兆以及试炼之兆的影响（防止假人触发劫掠）


# ═════════════════════════════════════════════════════════════════════════════
#  4 · AI & 寻路
#  所有假人共享同一个 AI 行为：头部追踪、游泳
#  物理碰撞、寻找路线以及（即将到来的）PVP 模块。
# ═════════════════════════════════════════════════════════════════════════════

# ── 头部 AI ───────────────────────────────────────────────────────────────────
# 假人会自动看向附近的玩家。
head-ai:
  enabled: true
  look-range: 8.0 # 检测玩家的范围
  turn-speed: 0.3 # 平滑转动程度 — 0.0 = 不转动视角 · 1.0 = 瞬间转动视角
  tick-rate: 3 # 每 N 刻触发扫描 + 射线。
               # 值越高 = CPU 占用越低。3 ≈ 每秒扫描 7 次，玩家一般无法分辨。
               # 填入值的范围：1（每刻检查一次） 到 20（每秒检查一次）。

# ── 游泳 AI ───────────────────────────────────────────────────────────────────
# 假人潜入水中后自动触发游泳，模拟在水中按住空格键。
swim-ai:
  enabled: true # 只控制被动上浮的“游泳”；默认强制避水寻路

# ── 挤压 & 推动 ──────────────────────────────────────────────────────────
# 决定玩家接触假人时推开的力度，以及假人之间如何相互分开。
# 默认设置适用于大部分服务器 — 只在遇到堆叠相关问题时才应该调整设置。
collision:
  walk-radius: 0.85 # 接触假人能够产生碰撞的范围（单位为格）
  walk-strength: 0.22 # 接触假人产生的推动力度
  hit-strength: 0.45 # 直接攻击产生的击退力度
  hit-max-horizontal-speed: 0.8 # 被攻击/爆炸击退时的最大水平速度
  bot-radius: 0.9 # 假人之间的分离半径
  bot-strength: 0.14 # 假人之间的分离力度
  max-horizontal-speed: 0.3 # 走动与分离源的最大推动速度

# ── 寻路 ───────────────────────────────────────────────────────────────
# /fpp move、/fpp mine、/fpp place、/fpp use 及路径点巡逻功能共用的 AI 寻路选项。
# 对这些设置的改动在下一次计算中就会生效。
pathfinding:
  # ── 特性标志 ─────────────────────────────────────────────────────────
  parkour: false # 是否疾跑跳过 1-2 格宽的间隙
  break-blocks: false # 是否破坏路径上阻挡的方块
  place-blocks: false # 放置方块跨过一格宽的间隙
  place-material: DIRT # 搭路时使用的方块（建议填入任意实心方块名称）
  
  # ── 寻路微调 ─────────────────────────────────────────────────────
  arrival-distance: 1.2 # 固定目标触及目的地半径
  patrol-arrival-distance: 1.5 # 巡逻循环的触及路径点半径
  waypoint-arrival-distance: 0.65 # 嗅探可用路径点的半径
  sprint-distance: 6.0 # 距离目的地超过这个大小时开始疾跑
  follow-recalc-distance: 3.5 # 目标移动超过这个距离后重新计算路径
  follow-recalc-interval: 100 # 跟随心跳重新计算的间隔，单位为刻
  recalc-interval: 60 # 心跳重新计算的间隔，单位为刻
  
  # ── 卡死检测 ────────────────────────────────────────────────────────
  stuck-ticks: 5 # 假人被判定为卡住的低移动检测时间
  stuck-threshold: 0.04 # 触发脱离卡死逻辑前最小的每刻水平移动速度
  
  # ── 方块交互 ──────────────────────────────────────────────────────
  break-ticks: 15 # 破坏寻路方块前耗费的刻数
  place-ticks: 5 # 放置搭路方块时耗费的刻数
  
  # ── 搜索限制 ─────────────────────────────────────────────────────────
  max-range: 64 # 直线搜索范围的大小，单位为格
  max-nodes: 900 # 直接搜索的节点上限
  max-nodes-extended: 1800 # 启用跑酷/破坏/放置后的节点上限
  max-fall: 3 # 允许假人在寻路过程中出现的坠落最大高度（范围为 1-16）

# ═════════════════════════════════════════════════════════════════════════════
#  5 · 假人聊天
#  假人会间隔一段时间发送 bot-messages.yml 中预留的消息。
#  这些发出的消息会触发 AsyncChatEvent — 意味着它兼容 EssentialsChat、VentureChat 等聊天插件。
#  让它们与普通玩家发出的消息保持同一格式（不会出现“[不安全]”标签）。
# ═════════════════════════════════════════════════════════════════════════════
fake-chat:
  enabled: false
  require-player-online: true # 只在至少一个玩家在线时发送聊天消息
  chance: 0.75 # 每次间隔发送一次消息的几率（0.0 - 1.0）
  interval:
    min: 5 # 假人消息发送的最小间隔，单位为秒，下同
    max: 10 # 假人消息发送的最大间隔
  
  # ── 仿真 ────────────────────────────────────────────────────────────────
  typing-delay: true # 在每条消息之前加上模拟的输入延迟（0 - 2.5 秒）
  activity-variation: true # 给每个假人设置一个随机的频率阶段（沉默寡言 -> 善于聊天）
  history-size: 5 # 假人最近的几条的消息不会重复发送
  stagger-interval: 3 # 两个假人相互聊天的最短间隔（0 = 关闭功能）
  
  burst-chance: 0.12 # 假人发送附和消息的几率
  burst-delay:
    min: 2
    max: 5
  
  # ── 假人间对话 ───────────────────────────────────────────────
  # 假人可以读取并回复其他假人的聊天栏消息，借此模拟对话。
  # 当假人发送自然的聊天消息时，其他假人可能会跟上快速回复。
  # 对话会触发连锁反应而继续进行，直到到达触发上限。
  bot-to-bot:
    enabled: true
    reply-chance: 0.35 # 其他假人回复正在发送消息的假人的几率
    chain-chance: 0.4 # 每次对话继续进行的概率
    max-chain: 3 # 聊天对话进行的最少数量
    cooldown: 8 # 假人对话发生的冷却（全服生效），单位为秒
    delay:
      min: 4 # 触发假人对话的最小时间间隔，单位为秒，下同
      max: 14 # 触发假人对话的最大时间间隔
  
  # ── 提及回复 ────────────────────────────────────────────────────────
  # 当真实玩家提到假人的名字时，是否给予回复。
  reply-to-mentions: true
  mention-reply-chance: 0.65 # 被叫到名字的假人回复的概率（0.0-1.0）
  reply-delay:
    min: 2
    max: 8
  
  # ── 远程格式 ──────────────────────────────────────────────────────────
  # 用于无实体或跨群组假人发送的聊天消息。
  # 支持内建变量 {name}（显示名称）以及 {message}（发送的消息文本）。
  remote-format: '<yellow>{name}<dark_gray>: <white>{message}'
  
  # ── 事件触发反应 ──────────────────────────────────────────────
  # 假人会对玩家触发的事件做出回应，并从 bot-messages.yml 中选择预设消息回复。
  event-triggers:
    enabled: true # 主开关 — 同样控制下面的子触发器
    
    on-player-join:
      enabled: true
      chance: 0.4 # 玩家加入时假人发送消息的几率
      delay:
        min: 2
        max: 6
    
    on-death:
      enabled: true
      players-only: false # true = 只在玩家死亡时发送消息（忽略实体/动物的死亡）
      chance: 0.3
      delay:
        min: 1
        max: 4
    
    on-player-leave:
      enabled: true
      chance: 0.3
      delay:
        min: 1
        max: 4
    
    on-advancement: # 当玩家达成进度时发送消息
      enabled: true
      chance: 0.45
      delay:
        min: 1
        max: 5
    
    on-first-join: # 新玩家加入服务器时是否发送欢迎消息（首次加入事件）
      enabled: true
      chance: 0.7 # 默认值更高 — 应该欢迎萌新加入！
    # 使用 first-join-reactions 列表中的句子（若为空则使用 join-reactions 中的句子）

    on-kill: # 当玩家击杀其他真实玩家时发送消息
      enabled: true
      chance: 0.35
      delay:
        min: 1
        max: 4
    
    on-high-level: # 当玩家到达指定经验等级时发送消息
      enabled: true
      min-level: 30 # 只对到达这个等级以上的玩家作出反应(例如：30、50、75、100 等）
      chance: 0.35
      delay:
        min: 1
        max: 5
  
  # ── 玩家聊天反应 ──────────────────────────────────────────────────
  # 真实玩家发送聊天消息时，可能会被假人回应。
  # 随机发送 bot-messages.yml 下 player-chat-reactions 部分的内容。
  # {player_name} = 发送消息的玩家，{name} = 回复的假人名称。
  on-player-chat:
    enabled: false # 此功能的主开关
    use-ai: true # 是否使用 AI 生成上下文回复（需要预先设置 AI 对话功能）
    ai-cooldown: 30 # 同一个假人再次回应的时间间隔（仅 AI 模式）
    chance: 0.25 # 回复任意玩家消息的几率（0.0-1.0）
    max-bots: 1 # 回复同一条消息的假人数量上限（推荐设置在 1-3 之间）
    ignore-short: true # 是否忽略短于 3 个字符的消息（避免假人对 k、ok 等短回复产生反应）
    ignore-commands: true # 跳过以 / 开头的消息（即命令）
    mention-player: 0.5 # 反应直接提到玩家名字的概率
    delay:
      min: 2 # 触发反应的最小时间间隔，单位为秒，下同
      max: 8 # 触发反应的最大时间间隔
  
  # ── 关键词反应 ──────────────────────────────────────────────────────
  # 当玩家的消息包含关键词时，随机假人会
  # 从 bot-messages.yml 中的指定词句列表中抽取一条发送。
  keyword-reactions:
    enabled: false
    keywords: {}
# 例如：
#   trade: "trade-reactions"
#   help: "help-reactions"


# ═════════════════════════════════════════════════════════════════════════════
#  6 · AI 对话
#  假人会回复 /msg、/tell 或 /whisper 命令发送的聊天消息，根据性格产生不同的回复。
#  每个假人都会保留对不同玩家的对话记忆。
#
#  ⚠ 需要在 secrets.yml 中设置 API 密钥（OpenAI、Qrok 或 Anthropic 等）才可以使用。
#     设置：编辑 plugins/FakePlayerPlugin/secrets.yml 文件
#     若需要完全禁用 AI 对话功能，只需将 secrets.yml 留空即可。
#
#  支持提供方（按优先级排列）：
#    OpenAI · Anthropic · Groq · Google Gemini · Ollama · Copilot · 自定义
# ═════════════════════════════════════════════════════════════════════════════
ai-conversations:
  enabled: true # 主开关 — 设置为 false 可禁用所有 AI 私聊消息
  
  # ── 性格 ─────────────────────────────────────────────────────────────
  # 默认给所有假人使用的性格文件（除非单独设置覆盖）
  # 会引用 plugins/FakePlayerPlugin/personalities/ 中的 .txt 文件
  # 可用变量：{bot_name} = 假人的实际名称
  # 单独覆盖命令：/fpp personality <假人名称> set <性格名称>
  # 自定义 prompt：将 .txt 文件放入 plugins/FakePlayerPlugin/personalities/ 文件夹即可
  default-personality: default # 读取 personalities/default.txt 文件
  
  # ── 输入延迟 ─────────────────────────────────────────────────────────────
  # 模拟消息出现前的打字延迟。
  # 延迟按如下方法计算：基础值 +（消息长度 * 每个字符耗时）秒，不会超过设定上限。
  typing-delay:
    enabled: true
    base: 1.0 # 产生任意回复前的基础延迟，单位为秒，下同
    per-char: 0.07 # 回复中的每个字符产生的额外延迟
    max: 5.0 # 最大延迟
  
  # ── 行为 ────────────────────────────────────────────────────────────────
  max-history: 10 # 每次对话记住多少次对话（玩家 + 假人）
  cooldown: 3 # 假人回复同一玩家的延迟

  # ── 调试 ───────────────────────────────────────────────────────────────────
  debug: false # 向控制台发送所有 AI 请求与响应

# ═════════════════════════════════════════════════════════════════════════════
#  7 · 定时任务
# ═════════════════════════════════════════════════════════════════════════════

# ── 切换 / 会话轮换 ───────────────────────────────────────────────────
# 假人会周期性加入退出服务器，模拟真实玩家的会话。
# 每个假人都有随机的会话时长及性格。
swap:
  enabled: false # 主开关 — false = 假人从不自动轮换
  max-swapped-out: 0 # 单次假人下线最大数（0 = 不限制）
  min-online: 0 # 假人在线数量下线（0 = 不限制）；若假人数量低于这个值，则不触发切换
  same-name-on-rejoin: true # 重复加入时使用先前的假人名称（若可能）
  farewell-chat: true # 离开前假人是否说再见（需启用 fake-chat 选项）
  greeting-chat: true # 进入时假人是否打招呼（需启用 fake-chat 选项）
  retry-rejoin: true # 自动加入失败时是否重试（如达到 max-bots 规定的最大假人数量时）
  retry-delay: 60 # 重试加入的间隔，单位为秒
  
  session: # 假人保持在线时长
    min: 60 # 最小值，单位为秒，下同（60 秒 = 1 分钟）
    max: 300 # 最大值（300 = 5 分钟）
  
  absence: # 会话间隔的假人保持离线状态的时长
    min: 30 # 最小值，单位为秒，下同
    max: 120 # 最大值

# ── 高峰期 ────────────────────────────────────────────────────────────────
# 基于窗口期自动修改假人在线的数量，
# 模拟真实玩家活动（晚高峰、凌晨及周末高峰）。
#
# 需要开启：swap 设置
#
# 原理：
#   · 定时器每分钟检同步一次服务器时间。
#   · 匹配的时间段则应用对应的假人列表策略。
#     例如：0.75 的比例表示 75% 的假人在线，其他进入待机状态。
#   · 假人轮换是陆续进行的，看起来会更加自然。
#
# 命令：/fpp peaks status | next | force | list | wake <假人名称> | sleep <假人名称>
peak-hours:
  enabled: false
  timezone: UTC # 任意 java.time.ZoneId 字符串，如 "America/New_York"
  stagger-seconds: 30 # 将每次假人进入或退出限制在这个时间长度内完成
  min-online: 0 # 忽视百分比，在线的假人最小数量
  notify-transitions: false # 向带有 fpp.peaks 权限的管理员发送窗口期变动的消息
  
  # ── 日常定时任务 ─────────────────────────────────────────────────────────
  # 优先选择时间最早且处于范围内的窗口期。隔夜窗口期（如 22：00 至次日 06：00）同样有效。
  # 百分比：1.0 = 所有假人在线 · 0.0 = 全体假人待机
  schedule:
  - start: 06:00
    end: 09:00
    fraction: 0.3
  - start: 09:00
    end: '18:00'
    fraction: 0.75
  - start: '18:00'
    end: '22:00'
    fraction: 1.0
  - start: '22:00'
    end: 06:00
    fraction: 0.05
  
  # ── 每周覆盖 ──────────────────────────────────────────────────
  # 填入键必须为大写，周一至周日分别为：MONDAY TUESDAY WEDNESDAY THURSDAY FRIDAY SATURDAY SUNDAY
  # 去除下述任意一条即表示使用默认配置。
  day-overrides:
    SATURDAY:
    - start: '10:00'
      end: '23:00'
      fraction: 1.0
    - start: '23:00'
      end: '10:00'
      fraction: 0.1
    SUNDAY:
    - start: '10:00'
      end: '22:00'
      fraction: 0.9
    - start: '22:00'
      end: '10:00'
      fraction: 0.1


# ═════════════════════════════════════════════════════════════════════════════
#  8 · 数据库 & 网络
#  Records every bot session for auditing and /fpp info queries.
#  每次假人会话时记录，用于后期审查及 /fpp info 查询。
#  SQLite：无配置，存储于 plugins/FakePlayerPlugin/data/fpp.db
#  MySQL：  需要多服（Velocity / BungeeCord）同步设置。
#
#  mode: LOCAL   — 单服。无跨服过滤。
#  mode: NETWORK — 在多个后端服务器间共享 MySQL 数据库。
#                  每个服务器都会为其添加的内容标注服务器 ID，防止不同服务器间同名假人混淆。
#
#  群组服快速设置指南：
#    1. 将 mode 设置为 "NETWORK"
#    2. 为每个子服设置不同的 ID（如“survival”、“skyblock”）
#    3. 启用 mysql-enabled 设置，填入登录凭据
#    4. 对于使用 Velocity 核心的服主：将 velocity.toml 中 bungeecord-compat-mode 设置为 true 
#    5. 在所有子服上输入命令 /fpp reload
# ═════════════════════════════════════════════════════════════════════════════
database:
  enabled: true # false = 无数据库读写，无分析，仅保持文件存储 
  mode: LOCAL # 可填入 LOCAL 或 NETWORK
  server-id: default # 服务器名称，不可重复（仅 NETWORK 模式下有效）
  
  mysql-enabled: false
  mysql:
    host: localhost
    port: 3306
    database: fpp
    username: root
    password: ''
    use-ssl: false
    pool-size: 5
    connection-timeout: 30000
  
  location-flush-interval: 30 # 假人位置同步至数据库的时间间隔，单位为秒
  session-history:
    max-rows: 20 # /fpp info 查询返回的最大内容数

# ── 配置同步 ───────────────────────────────────────────────────────────────
# 在后端服务器及共享的 MySQL 数据库上推送/拉取配置文件。
# 仅在启用数据库的 NETWORK 模式下有效。
# DISABLED  — 不同步
# MANUAL    — 通过命令 /fpp sync 手动进行同步
# AUTO_PULL — 服务器开启及输入命令 /fpp reload 时自动拉取配置文件
# AUTO_PUSH — 自动推送配置文件
config-sync:
  mode: DISABLED


# ═════════════════════════════════════════════════════════════════════════════
#  9 · 性能
#  将瓶颈转化为大量假人的部署。
#  不影响游戏体验 — 只改变主线程性能开销。
# ═════════════════════════════════════════════════════════════════════════════
performance:
  # 正在移动的假人每刻发送数据同步包的最大距离（单位为格）
  # 超出这个范围的玩家无法看到假人。
  # 0 = 发送给所有在线玩家，而无视其与假人的距离（旧行为）。
  # 建议值：128（标准玩家的实体追踪范围）。
  position-sync-distance: 128.0


# ═════════════════════════════════════════════════════════════════════════════
#  10 · 调试 & 日志
#  所有标志默认为 false，防止控制台刷屏。
#  只在你需要探索详细内容时使用，设置为 debug: true 即可全部开启。
# ═════════════════════════════════════════════════════════════════════════════
debug: false # 主开关 — 设置为 true 表示启用下列所有设置。

logging:
  debug:
    startup: false # 启动流、重载及兼容性检查
    nms: false # NMS 反射，伪连接及实体生成
    packets: false # TAB 列表及实体包构建与发送
    luckperms: false # LuckPerms 权限组同步及前缀刷新
    network: false # Velocity/Bungee 插件信道及远程假人同步
    config-sync: false # 配置推送/拉取活动
    skin: false # 皮肤载入与注入
    database: false # 数据库初始化、迁移及会话写入
    chat: false # 假人聊天 AI 计划表、反应及事件触发器
    swap: false # 切换/会话轮换 + 重进循环

# ── 更新检查 ────────────────────────────────────────────────────────────
update-checker:
  enabled: true # 是否在服务器启动及输入命令 /fpp reload 时检查插件的可用更新

# ── 命名牌交互 ───────────────────────────────────────────────────────
# 软依赖命名牌插件（可在 lode.gg 获取）。
# 这些设置只在 NameTag 插件与本插件一同安装时生效。
# ── 攻击实体目标 ──────────────────────────────────────────────────────
# 默认用于 /fpp attack --mob（PvE 自动追踪模式）。
attack-mob:
  default-range: 8.0 # 检测范围，单位为格（可通过 --range 参数覆盖）
  default-priority: nearest # 可填入 nearest | lowest-health
  smooth-rotation-speed: 12.0 # 转头看向目标时头部每刻转动的角度
  retarget-interval: 10 # 扫描新目标的时间长度，单位为刻（待机时）
  line-of-sight: true # 是否只追踪能直接被看见的目标

nametag-integration:
  # 防止假人的 --name 标签与真实玩家名字相符。
  # 若出现这样的情况，阻止假人生成并向执行命令的玩家发送语言文件中“spawn-name-taken-nick”对应的消息。
  block-nick-conflicts: true
  # 在假人生成后，从命名牌列表中去掉对应的缓存
  # 这可以防止命名牌将假人判定为正式玩家并尝试存储昵称数据
  # 如果假人已经有通过命名牌设置的名称
  # 那么保留缓存的条目（见下 sync-nick-as-rename 设置）
  bot-isolation: true
  # 当假人通过命名牌获得昵称后（命令 /nick 假人A Steve），
  # 自动触发本插件的重命名命令，这样假人的真实 Minecraft 名称就会变为昵称
  # 重命名是静默执行的（只在控制台显示），且能保留所有假人状态信息。
  # 需要 bot-isolation 选项为 true。默认为 false — 谨慎开启。
  sync-nick-as-rename: false

# ── 统计数据 ───────────────────────────────────────────────────────────────────
# 将数据匿名上传到 FastStats。不会收集任何个人信息。
metrics:
  enabled: true
