# ─────────────────────────────────────────────────────────────────────────────
#  ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ ᴘʟᴜɢɪɴ  ·  language/en.yml
#  可按需编辑，输入命令 /fpp reload 即可无需重启服务器应用更改。
#
#  颜色格式：MiniMessage 标签
#    颜色名字 ：<red>, <gray>, <white>, <dark_gray>, <yellow> …
#    十六进制 ：<#0079FF>text</#0079FF>
#    文字样式 ：<bold>, <italic>, <underlined>, <strikethrough>
#    清除格式 ：<reset>
#  变量：{placeholder} — 可用变量见介绍内容
#
#  ⚠  标记“内部”的字段由排版引擎使用。
#     可以修改使用的颜色及文本，但关键词应当保持不变。
# ─────────────────────────────────────────────────────────────────────────────

# ── 插件前缀 — 对所有 [FPP] 消息生效 ──────────────────────────
#  可按需修改颜色/文本内容，但请保持简洁。
prefix: "<dark_gray>[<#0079FF>ꜰᴘᴘ</#0079FF><dark_gray>]<reset> "


# ═════════════════════════════════════════════════════════════════════════════
#  1 · 内部排版  —  请勿删除或重命名键
#  可以修改使用的颜色及文本，但关键词及结构应当保持不变。
# ═════════════════════════════════════════════════════════════════════════════

# 用于页首与页尾的水平分割线
divider: "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st>"

# 帮助菜单（需要包含 {cmd}、{args}、{desc} 变量）
help-header: "<dark_gray><st>━━━━━━━━━</st> <#0079FF><bold>ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ ᴘʟᴜɢɪɴ</#0079FF> <dark_gray><st>━━━━━━━━━</st>"
help-entry:  "  <#0079FF>/{cmd}</#0079FF><gray> {args} <dark_gray>— <white>{desc}"
help-footer: "<dark_gray><st>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</st>"

# 插件信息界面（/fpp bare）— 页首内容
info-screen-header: "  <#0079FF><bold>ꜰᴀᴋᴇ ᴘʟᴀʏᴇʀ ᴘʟᴜɢɪɴ</#0079FF> <dark_gray>· <gray>ꜰᴘᴘ"


# ═════════════════════════════════════════════════════════════════════════════
#  2 · 一般错误提示
# ═════════════════════════════════════════════════════════════════════════════

# {0} — 根命令行（如“fpp”）
no-permission:  "{prefix}<red>你没有权限这么做。"
unknown-command: "{prefix}<red>未知子命令。<gray>输入命令 <#0079FF>/{0} ʜᴇʟᴘ</#0079FF><gray> 获取详细帮助。"
player-only:    "{prefix}<red>只有玩家才可运行此命令。"
invalid-number: "{prefix}<red>数字无效。请输入正整数。"


# ═════════════════════════════════════════════════════════════════════════════
#  3 · 生成
# ═════════════════════════════════════════════════════════════════════════════

# ── 生成结果 ──────────────────────────────────────────────────────────────
# {count} — 生成的假人数量  |  {total} — 全局启用数量  |  {name} — 假人名称
# {max}   — 全局上限          |  {limit} — 个人上限
spawn-success:            "{prefix}<gray> 已<white>召唤<#0079FF>{count}</#0079FF> <gray>个。<dark_gray>（<gray> 已激活 <#0079FF>{total}</#0079FF> <gray>个<dark_gray>）"
spawn-max-reached:        "{prefix}<red>你已到达召唤数量上限 <dark_gray>（<#0079FF>{max}</#0079FF> <gray>ʙᴏᴛꜱ<dark_gray>）<red>。请先删掉一些假人。"
spawn-user-limit-reached: "{prefix}<red>你已到达个人召唤数量上限 <dark_gray>（<#0079FF>{limit}</#0079FF> <gray>ʙᴏᴛ<dark_gray>）<red>）"
spawn-invalid:            "{prefix}<red>无效用法。<gray>命令格式为 <#0079FF>/fpp spawn [afk] [数量] [--name <名称>] [--random-name] [--notp]</#0079FF><gray>。"
spawn-invalid-name:       "{prefix}<red>ɪ无效假人名称。<gray>名称请保持在 <white>1–16 <gray>个字符以内 <dark_gray>（<white>英文字母<gray>、<white>数字<gray>、<white>下划线<dark_gray>）<gray>。"
spawn-badword-rejected:   "{prefix}<red>假人名称“<white>{name}<red>”无效<dark_gray>（<gray>包含非法字符或：<white>{badword}<dark_gray>）<red>。"
spawn-badword-auto-prefixed: "{prefix}<yellow>⚠ 假人名称<gray>“<red>{original}<gray>”包含违规词 — 已重命名为“<#0079FF>{name}</#0079FF><gray>”。"
badword-filter-empty-warning: "{prefix}<yellow>⚠ <gray>检测到屏蔽词过滤已经<white>启用<gray>，但<red>没有配置来源<gray>。<dark_gray>启用 <white>badword-filter.use-global-list <dark_gray>设置或在 <white>badword-filter.words <dark_gray>/ <white>bad-words.yml<dark_gray>中添加违规词，然后输入命令 <white>/fpp reload<dark_gray> 重载。"
spawn-name-taken:         "{prefix}<red>已经存在名为 <white>{name} <red> 的假人。"
spawn-name-taken-player:  "{prefix}<red>已经有名为 <white>{name} <red>的玩家在线。"
spawn-name-taken-nick:    "{prefix}<red>存在同名的真实玩家 <white>{name}<red>。<gray>请重新选择一个假人名称。"
spawn-relog-not-found:    "{prefix}<red>保存的列表中没有名为 <white>{name}<red> 的假人。"
spawn-relog-world-missing: "{prefix}<red>无法重新记录 <white>{name}<red> — 先前所在世界 <white>{world}<red> 尚未载入。"
spawn-no-names-left:      "{prefix}<red>名称列表中的所有名称都被占用。<gray>请减少活跃假人数量或添加新名称。"

# ── 控制台/位置错误 ──────────────────────────────────────────────────
# {world} — 不存在的世界名称
spawn-console-no-world:   "{prefix}<red>没有载入的世界 — 无法设置出生位置。"
spawn-world-not-found:    "{prefix}<red>世界“<white>{world}<red>”不存在或未载入。"
spawn-invalid-coords:     "{prefix}<red>无效坐标。<gray>正确格式：<white>x,y,z <gray><dark_gray>（如 <white>100,64,200<gray>）"

player-not-found:   "{prefix}<red>玩家 <white>{player} <red>不在线。"

# ── 召唤冷却 ─────────────────────────────────────────────────────────────
# {seconds} — 剩余时间
spawn-cooldown: "{prefix}<red>请等 <white>{seconds}秒<red> 后再生成假人。"


# ═════════════════════════════════════════════════════════════════════════════
