# ═════════════════════════════════════════════════════════════════════════════
#  15 · 高峰期  （按时间变换假人池）
# ═════════════════════════════════════════════════════════════════════════════

# {window}       — 窗口期时间显示（如 18:00–22:00）
# {fraction}     — 当前目标分离百分比 （如 75%）
# {target}       — 目标在线假人数
# {online}       — 目前在线挂机假人数
# {swapping}     — 通过 BotSwapAI 会话轮换功能暂时下线的假人数量
# {sleeping}     — 在高峰期假人池中待机的假人数量
# {total}        — 假人池大小 （在线假人 + 待机假人 + 轮换假人）
# {time}         — 下次窗口期的时间显示 （如 1h 20m）
# {next_fraction}— 下次窗口期分离百分比 （e.g. 5%）
# {count}        — 待机假人数量  |  {name} — 假人名称
# {timezone}     — 配置的时区字符串
peaks-enabled:       "{prefix}<#0079FF>高峰期</#0079FF> 功能已 <gray>启用<gray>。"
peaks-disabled:      "{prefix}<#0079FF>高峰期</#0079FF> 功能已 <gray>禁用 — 所有待机假人已激活<gray>。"
peaks-status-on:     "{prefix}<#0079FF>高峰期</#0079FF> <dark_gray>│ <gray>窗口期：<white>{window} <dark_gray>│ <gray>分离：<#0079FF>{fraction}</#0079FF> <dark_gray>│ <gray>目标：<#0079FF>{target}</#0079FF> <dark_gray>│ <gray>在线：<#0079FF>{online}</#0079FF> <dark_gray>│ <gray>轮换：<#0079FF>{swapping}</#0079FF> <dark_gray>│ <gray>待机：<#0079FF>{sleeping}</#0079FF> <dark_gray>│ <gray>总数：<#0079FF>{total}</#0079FF> <dark_gray>│ <gray>时区：<white>{timezone}"
peaks-status-off:    "{prefix}<#0079FF>高峰期</#0079FF> <gray>功能已 <white>禁用<gray>。"
peaks-next-window:   "{prefix}<gray>下次窗口期为 <#0079FF>{time}</#0079FF>。<dark_gray><#0079FF>{next_fraction}</#0079FF> <gray>的假人将会陆续上线<gray>。"
peaks-no-windows:    "{prefix}<gray>无窗口期配置 — 请编辑 config.yml 中的 <white>peak-hours.schedule<gray> 选项。"
peaks-requires-swap: "{prefix}<red>高峰期需要启用 <white>swap.enabled<red> 设置。请先输入命令 <white>/fpp swap on<red> 开启这个功能。"
peaks-invalid:       "{prefix}<red>命令用法<gray>：<#0079FF>/fpp peaks <on|off|status|next|force|list|wake|sleep></#0079FF><gray>。"
peaks-force-check:   "{prefix}<gray>已触发高峰期强制检查。"
peaks-list-header:   "{prefix}<gray>待机假人<dark_gray>（<#0079FF>{count}</#0079FF>）<gray>："
peaks-list-entry:    "  <dark_gray>┃ <white>{name} <dark_gray>@ <gray>{world} <dark_gray>[<gray>{x}<dark_gray>, <gray>{y}<dark_gray>, <gray>{z}<dark_gray>]"
peaks-list-empty:    "{prefix}<gray>目前无待机假人。"
peaks-wake-success:  "{prefix}<gray>已唤醒 <white>{name}<gray>。"
peaks-wake-all:      "{prefix}<gray>已唤醒 <#0079FF>{count}</#0079FF> 个假人。"
