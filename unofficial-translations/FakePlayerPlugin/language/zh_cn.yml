delete-not-found:      "{prefix}<red>没有找到名为 <white>{name}<red> 的活跃假人。"
# {count} — 随机清理的假人数量
delete-random-success: "{prefix}<#0079FF>{count}</#0079FF> <gray>个随机假人 <white>已退出<gray>。"
# {count} — 按顺序清除的假人数量（存在时间从早到晚）
delete-num-success:    "{prefix}<#0079FF>{count}</#0079FF> <gray>ꜰ个随机假人 <white>已退出<gray>。"
despawn-num-usage:     "{prefix}<red>命令用法：<white>/fpp despawn --num <数量></white>。"


