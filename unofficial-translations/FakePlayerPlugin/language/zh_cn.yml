delete-success:        "{prefix}<gray>假人 <#0079FF>{name}</#0079FF> <white>已退出<gray>。"
delete-all:            "{prefix}<#0079FF>{count}</#0079FF> <gray>个假人 <white>已退出<gray>。"
delete-none:           "{prefix}<red>目前没有假人在线。"
