    # 如果使用这个拓展时遇到问题，请将这个设置改为 false。
    use-name: true
    # 支持这个经济插件的银行拓展，如果需要为这个经济启用拓展，那么将其设置为 true。
    # 启用后，如果玩家没有足够的钱，插件会试图从银行中取出玩家所需的货币。
    banks:
      bankplus:
        # 是否为这个类型的经济启用 bankplus 兼容？
        enabled: true
        # 应当使用什么作为玩家的默认银行账户？未设置时使用默认银行。
        bank: ""

  tokenmanager:
    # 是否启用 TokenManager 经济？
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 价格变量的前缀，即使用 tokenmanager 货币时显示的名称.
    prefix: "%price% 代币"
  playerpoints:
    # 是否启用 PlayerPoints 经济？
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
