# 在这里你可以选择将部分其他插件的数据转化为本插件的数据.
# 确保在转化后卸载这些插件!
converters:
  welcomewarpsigns:
    # 若该项启用, 插件将会将 Welcome Warp Signs (https://www.spigotmc.org/resources/12256/) 的数据转化至本插件.
    # 重启服务器才可使改动生效并开始数据转化.
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
  pwarp:
    # 若该项启用, 插件将会将 PWarp (https://www.spigotmc.org/resources/64542/) 的数据转化至本插件.
    # 重启服务器才可使改动生效并开始数据转化.
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
  playerwarps:
    # 若该项启用, 插件将会将 PLAYERWARPS (https://www.spigotmc.org/resources/79089/) 的数据转化至本插件.
    # 出于某些冲突, 你需要将被转化插件的文件夹 (plugins/PlayerWarps) 重命名为 "PlayerWarp"
    # 你也需要修改插件的名称, 使用诸如 WinRAR 的压缩包软件将此插件的 .jar 文件打开, 找到 plugin.yml 并将插件的名称改为 "PlayerWarp".
    # 重启服务器才可使改动生效并开始数据转化.
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest

# 在这部分配置中你可以设置按需配置其他支持本插件的拓展相关功能.
expansions:
  # 是否启用 ProtocolLib 支持？通常用于告示牌搜索功能。
  protocollib:
    enabled: true
    # 需要下载/使用这个拓展的什么版本？
    version: 0

  # 是否启用 PacketEvents 支持？通常用于告示牌搜索功能。
  packetevents:
    enabled: true
    # 需要下载/使用这个拓展的什么版本？
    version: 0

  essentials:
    # 是否启用 Essentials 拓展?
    # 该拓展会为玩家在进行地标传送前记住他们最后上线的位置.
    # 你需要安装 Essentials 才可使该变量拓展生效!
    enabled: true
    # 需要下载/使用这个拓展的什么版本？
    version: latest
  huskhomes:
    # 是否启用 HuskHomes 拓展?
    # 该拓展会为玩家在进行地标传送前记住他们最后上线的位置.
    # 你需要安装 HuskHomes 才可使该变量拓展生效!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
  patches:
    # 包含对其他插件可能的冲突修复补丁。
    enabled: true
    # 需要下载/使用这个拓展的什么版本？
    version: 0

  # 该部分配置通过 Webhook 向你的 Discord 发送提醒消息.
  # 你可以参考 https://docs.olziedev.com/projects/playerwarps/features#discord-alerts 来学习如何配置该部分内容.
  warpdiscord:
    # 是否要启用 discord 挂钩拓展?
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    webhook:
      # 根据你的选择填入对应 Discord 频道的 Webhook 的链接.
      url: ""
      # 弹出的内嵌式消息所归属的用户名称.
      username: "地标传送提醒"
      # 内嵌式消息所显示的头像.
      avatar: "https://cdn.olziedev.com/playerwarps/images/PlayerWarpsIcon.png"
      # 消息中的普通文本, 若你只想显示内嵌式消息, 那么请留空.
      content: ""

      # 出现在内嵌式消息中的物品缩略图.
      thumbnail:
        enabled: true
        # 可以在此放入自定义缩略图, 以此匹配指定的自定义模型值物品.
        custom-thumbnails:
          # 若物品包含了值为 101 的自定义模型数据, 那么插件就会在内嵌式消息中使用该图片.
          101: "https://cdn.olziedev.com/playerwarps/images/PlayerWarpsIcon.png"

    embeds:
      set:
        enabled: true
        author: "[owner] 创建了一个名为 [warp_display] 的地标"
        # 如果你使用的是离线模式，你可以通过 [trigger_name] 变量获取玩家名称。
        author-image: "https://www.mc-heads.net/head/[trigger_uuid]/100/.png"
        color: "#4287f5"
        title: "地标提醒"
        footer: "地标 ID: [id]"
        fields:
          Owner:
            name: "拥有者"
            value: "[owner]"
            inline: true
          blank:
            name: ""
            value: ""
            inline: true
          Name:
            name: "名称"
            value: "[warp_display]"
            inline: true
          Date:
            name: "创建日期"
            value: "[date]"
            inline: true
          blank1:
            name: ""
            value: ""
            inline: true
          Location:
            name: "位置"
            value: "[world], [location]"
            inline: true
      tp:
        enabled: true
        author: "[teleporter] 访问了地标 [warp_display]"
        # 如果你使用的是离线模式，你可以通过 [trigger_name] 变量获取玩家名称。
        author-image: "https://www.mc-heads.net/head/[trigger_uuid]/100/.png"
        color: "#c90076"
        title: "地标提醒"
        footer: "地标 ID: [id]"
        fields:
          Owner:
            name: "拥有者"
            value: "[owner]"
            inline: true
          blank:
            name: ""
            value: ""
            inline: true
          Location:
            name: "位置"
            value: "[world], [location]"
            inline: true
          Date:
            name: "创建日期"
            value: "[date]"
            inline: true
          blank1:
            name: ""
            value: ""
            inline: true
          Description:
            name: "描述"
            value: "[desc]"
            inline: true

      remove:
        enabled: true
        author: "[warp_display] 已被移除!"
        # 如果你使用的是离线模式，你可以通过 [trigger_name] 变量获取玩家名称。
        author-image: "https://www.mc-heads.net/head/[trigger_uuid]/100/.png"
        color: "#bf2a2a"
        title: "地标提醒"
        footer: "地标 ID: [id]"
        fields:
          Owner:
            name: "拥有者"
            value: "[owner]"
            inline: true
          blank:
            name: ""
            value: ""
            inline: true
          Location:
            name: "位置"
            value: "[world], [location]"
            inline: true
          Date:
            name: "创建日期"
            value: "[date]"
            inline: true
          blank1:
            name: ""
            value: ""
            inline: true
          Description:
            name: "描述"
            value: "[desc]"
            inline: true

# 在这里你可以选择对接哪些额外内容, 用于按需配置玩家的地标创建限制/网页地图等内容.
addons:
  # 是否启用额外检查以确保所有传送点均位于土地中, 或如果地标处于土地中则不对土地归属权进行限制?
  check-all-land: true
  plotsquared:
    # 是否启用 PlotSquared 支持?
    # 需要安装 PlotSquared 才可正常使用本功能!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 地皮成员是否视作拥有者？
    plot-members: true
    # 是否在创建地皮时自动生成一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在地皮被删除时一并删除地标?
    delete: true
    # 是否允许玩家在地皮内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    lang:
      not-in-plot: "%prefix% &c抱歉, 你不能在这里设置地标, &c你必须处于地皮内!"
      dont-own-plot: "%prefix% &c抱歉, 你不能在不属于自己的地皮上设置地标!"

  virtualrealty:
    # 是否启用 virtualrealty 兼容?
    # 需要安装 virtualrealty 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # （拥有放置权限的）受信任玩家是否视作地皮拥有者？
    trusted-members: true
    # 是否只允许在领地内设置地标？如果禁用，他们可以在郊区或领地内设置地标。
    only-land: true
    lang:
      not-in-plot: "%prefix% &c你不能在这里设置地标, &c你没有在地皮中!"
      dont-own-plot: "%prefix% &c你不能在这里设置地标, 你没有权限."

  worldguard:
    # 是否启用 WorldGuard 支持? (仅在服务器安装了较新版本的 WorldGuard 时有效)
    # 需要安装 WorldGuard 才可使该功能正常启用!
    # 该插件会自动向 WorldGuard 注册一个名为"set-warp"的标志.
    # 若你是第一次启用该功能, 你需要重启服务器才可让改动生效.
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 若设置了标志, 被设置标志的区域就允许玩家设置地标. 若区域未设置该标志, 则它的默认值是什么?
    # 若此处设置为 false, 那么玩家默认不能在任何区域内设置地标. 这也包括 __global__ 全局区域! 所以请确保为该区域设置了允许标志 (别忘了全局区域只针对一个世界, 每个世界的全局区域标志设置是独立的)
    # 若此处设置为 true, 那么玩家可以在未设置该标志的区域内自由设置地标.
    # 若此处设置为 force, 那么玩家必须在指定区域内才可设置地标 - 在该处设置为 force 时, 插件会无视区域标志, 只允许玩家在区域内设置地标.
    default: true
    # 是否在区域被删除时一并删除地标?
    # 出于 WorldGuard 的限制, 该设置只会在你安装了ProtectionStones 或 AdvancedRegionMarket 时生效.
    delete: false
    # 什么标志可以防止玩家传送至地标？你只能使用状态类型的标志，也就是只有“ALLOW”和“DENY”两个值的标志。
    # 例如，你可以禁止玩家传送至“PVP”标志设置为“ALLOW”的区域中的地标。
#    disallowed-state-flags:
#      PVP: ALLOW    
    lang:
      not-in-region: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你不在任何区域内!"
      in-region: "%prefix% &c抱歉, 你不能在这个区域内设置地标!"
      disallowed-state-flag: "%prefix% &c抱歉, 你不能前往这个地标, &c区域内特定的标志设置阻止了传送功能."

  askyblock:
    # 是否启用 ASkyBlock 支持?
    # 需要安装 ASkyBlock 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 岛屿成员是否视作拥有者？
    island-members: true
    # 是否在创建岛屿时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在岛屿被删除时一并删除地标?
    delete: true
    # 是否允许玩家在岛屿内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    lang:
      not-in-island: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于岛屿内!"
      dont-own-island: "%prefix% &c抱歉, 你不能在不属于你的岛屿中设置地标."

  bentobox:
    # 是否启用 BentoBox 支持?
    # 需要安装 BentoBox 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 岛屿成员是否视作拥有者？
    island-members: true
    # 是否在创建岛屿时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在岛屿被删除时一并删除地标?
    delete: true
    # 是否允许玩家在岛屿内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    lang:
      not-in-island: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于岛屿内!"
      dont-own-island: "%prefix% &c抱歉, 你不能在不属于你的岛屿中设置地标."

  griefprevention:
    # 是否启用 griefprevention 支持?
    # 需要安装 griefprevention 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 受信任玩家是否视作领地拥有者？
    trusted-players: true
    # 是否在创建岛屿时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在占领区被删除时一并删除地标?
    delete: true
    # 是否允许玩家在占领区内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    # 这些是允许 GriefPrevention 的占领区允许玩家无视其他限制创建地标的世界.
    allowed-worlds: []
    lang:
      not-in-claim: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于占领区内!"
      dont-own-claim: "%prefix% &c抱歉, 你不能在不属于你的占领区中设置地标."

  griefdefender:
    # 是否启用 griefdefender 支持?
    # 需要安装 griefdefender 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 受信任玩家是否视作领地拥有者？
    trusted-players: true
    # 是否在创建占领区时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在占领区被删除时一并删除地标?
    delete: true
    # 是否允许玩家在占领区内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    lang:
      not-in-claim: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于占领区内!"
      dont-own-claim: "%prefix% &c抱歉, 你不能在不属于你的占领区中设置地标."

  fabledskyblock:
    # 是否启用 fabledskyblock 支持?
    # 需要安装 fabledskyblock 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 岛屿成员是否视作拥有者？
    island-members: true
    # 是否在创建岛屿时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在岛屿被删除时一并删除地标?
    delete: true
    # 是否允许玩家在岛屿内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    lang:
      not-in-island: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于岛屿内!"
      dont-own-island: "%prefix% &c抱歉, 你不能在不属于你的岛屿中设置地标."

  iridiumskyblock:
    # 是否启用 iridiumskyblock 支持?
    # 需要安装 iridiumskyblock 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 受信任玩家是否视作岛屿拥有者？
    trusted-members: true
    # 是否在创建岛屿时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在岛屿被删除时一并删除地标?
    delete: true
    # 是否允许玩家在岛屿内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    lang:
      not-in-island: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于岛屿内!"
      dont-own-island: "%prefix% &c抱歉, 你不能在不属于你的岛屿中设置地标."

  lands:
    # 是否启用 lands 支持?
    # 需要安装 lands 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 可以通过这个设置限制土地内传送点最大数量。
    # 设置为 -1 表示不作限制。
    limit-per-lands: -1
    # 受信任玩家是否视作领地拥有者？
    trusted-players: true
    # 是否在创建土地时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称 or %land%
    warp-name-creation: "%player%"
    # 是否在指定土地出生点后创建一个地标? (仅在上述 create 未启用时有效)
    spawn-create: false
    # 是否在土地被删除时一并删除地标?
    delete: true
    # 是否在土地出生点被删除时一并删除地标? (仅在上述 spawn-create 未启用时有效)
    spawn-delete: false
    # 是否允许玩家在土地内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    # 强制 PlayerWarps 允许创建地标并无视任何土地限制
    force: false
    lang:
      not-in-land: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于土地内!"
      dont-own-land: "%prefix% &c抱歉, 你不能在不属于你的土地中设置地标."
      limit-reached: "%prefix% &c抱歉, 你不能在这里设置地标, &c土地内地标设置数量已到达上限."

  landlord:
    # 是否启用 landlord 支持?
    # 需要安装 landlord 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 受信任的好友是否视作领地拥有者？
    trusted-friends: true
    # 是否在创建土地时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
    # 是否在土地被删除时一并删除地标?
    delete: true
    # 是否允许玩家在土地内设置地标? 若关闭, 玩家可以在任意地点设置地标.
    only-land: true
    lang:
      not-in-land: "%prefix% &c抱歉, 你不能在这里设置地标, &c请确保你处于土地内!"
      dont-own-land: "%prefix% &c抱歉, 你不能在不属于你的土地中设置地标."

  kindomsx:
    # 是否启用 kingdomsx 支持?
    # 需要安装 kingdomsx 才可使该功能正常启用!
    enabled: false
    # 需要下载/使用这个拓展的什么版本？
    version: latest
    # 受信任的成员是否视作领地拥有者？
    trusted-members: true
    # 是否在创建土地时一并创建一个地标?
    create: false
    # 创建该类型地标时它的名称应当是什么? 目前为止你能在这里使用的内建变量只有 %player%, 它返回的是玩家名称
    warp-name-creation: "%player%"
