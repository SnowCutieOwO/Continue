# 为爱发电

managewarp:
  # 是否启用该界面，允许玩家通过菜单管理他们的地标？
  enabled: true
  # 该界面的名称是什么?
  name: "managewarp"
  # 该界面的显示标题是什么? (可以使用彩色代码)
  title: "&b&lManage - [warp_display]"
  # 界面的大小? (填入 9 的倍数, 最大为 54)
  size: 54
  # 打开该界面的时候执行哪些额外的操作?
  open-actions: []
  # 关闭该界面的时候执行哪些额外的操作?
  close-actions: []

  clickable-items:
    menu:
      name: "&b返回菜单"
      material: BOOK
      data: 0
      lore:
        - "&d点击&b返回至菜单."
      slot: 49
      amount: 1
      glowing: false

  items:
    # 放在界面装饰的物品
    1:
      # 物品的名称。
      name: " "
      # 物品的材料。
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      # 物品的数据值。
      data: 3
      # 可以添加多行描述！
      # 示例配置：
      # lore:
      #   - "&b这是一片玻璃板."
      slot: [0, 2, 6, 8, 18, 26, 36, 44, 46, 48, 50, 52]
      # 物品的堆叠数量。
      amount: 1
      # 点击时执行的命令。
      # [server] 表示以控制台身份执行
      # [player] 表示以玩家身份执行
      # commands:
      #   - "[server] msg %player% 你点击了这个物品！"
      glowing: false
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTZmOGFmYjI3YmFmYzc3YzJiODI1OTljMmY3YjhmMWY2ODMxMGU2YWE5MDRmMDUxYjA3YWIxYzJiNmIifX19 - 头颅材质
      #owner: Glass - 头颅对应玩家名称
    2:
      name: " "
      material: MAGENTA_STAINED_GLASS_PANE
      data: 2
      slot: [1, 3, 5, 7, 9, 17, 27, 35, 45, 47, 51, 53]
      amount: 1
    3:
      name: "&b传送"
      material: ENDER_EYE
      data: 0
      slot: 4
      amount: 1
      lore:
        - "&b点击传送至 &d[warp_display]"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[player] %cmd% %warp%"
      back: false
    4:
      name: "&b描述"
      material: WRITABLE_BOOK
      data: 0
      slot: 10
      amount: 1
      lore:
        - "&b点击设置 &d[warp_display] &b的描述"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[chat_wait] &b请输入描述.:[player] !color pwarp desc set %warp% %value%\n[server] %cmd% open mywarps -view %viewer% -player %player%"
        - "[close]"
      back: false
    5:
      name: "&b切换锁定"
      material: OAK_DOOR
      data: 0
      slot: 16
      amount: 1
      lore:
        - "&b切换地标 &d[warp_display] &b的锁定状态"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[player] %cmd% lock %warp%"
      back: false
    6:
      name: "&b分类"
      material: CHEST
      data: 0
      slot: 20
      amount: 1
      lore:
        - "&b左键点击设置 &d[warp_display] &b的分类"
        - "&b右键点击删除 &d[warp_display] &b的分类"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      left-commands:
        - "[chat_wait] &b请输入地标归入的分类.:[player] !color pwarp category set %warp% %value%\n[server] %cmd% open mywarps -view %viewer% -player %player%"
        - "[close]"
      right-commands:
         - "[chat_wait] &b请输入要删除的分类.:[player] !color pwarp category remove %warp% %value%\n[server] %cmd% open mywarps -view %viewer% -player %player%"
         - "[close]"
      back: false
    7:
      name: "&b封禁"
      material: NETHER_STAR
      data: 0
      slot: 22
      amount: 1
      lore:
        - "&b点击将玩家从 &d[warp_display] &b封禁"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[chat_wait] &b请输入玩家名称.:[player] !color pwarp ban set %warp% %value%\n[server] %cmd% open mywarps -view %viewer% -player %player%"
        - "[close]"
      back: false
    8:
      name: "&b图标"
      material: ITEM_FRAME
      data: 0
      slot: 24
      amount: 1
      lore:
        - "&b点击将地标 &d[warp_display] 的&b图标"
        - "&b设置为手持物品."
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[player] %cmd% icon set %warp%"
      back: false
    9:
      name: "&b到访玩家"
      material: CAKE
      data: 0
      slot: 29
      amount: 1
      lore:
        - "&b点击浏览地标 &d[warp_display] 的&b访客列表"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[player] %cmd% open visitedplayers -warp %warp%"
      back: false
    10:
      name: "&b封禁玩家列表"
      material: RED_BANNER
      data: 1
      slot: 33
      amount: 1
      lore:
        - "&b点击浏览地标 &d[warp_display] 的&b封禁玩家列表"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[player] %cmd% open bannedplayers -warp %warp%"
      back: false
    11:
      name: "&b重命名"
      material: NAME_TAG
      data: 0
      slot: 37
      amount: 1
      lore:
        - "&b点击重命名地标 &d[warp_display]"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[chat_wait] &b请输入地标的新名称.:[player] !color pwarp rename %warp% %value%\n[server] %cmd% open mywarps -view %viewer% -player %player%"
        - "[close]"
      back: false
    12:
      name: "&b删除"
      material: BARRIER
      data: 0
      slot: 40
      amount: 1
      lore:
        - "&b点击删除地标 &d[warp_display] &c&l(不可撤销)"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[player] %cmd% remove %warp%"
      back: false
    13:
      name: "&b转移拥有权"
      material: PLAYER_HEAD
      data: 3
      slot: 43
      amount: 1
      owner: "[owner]"
      lore:
        - "&b点击将地标 &d[warp_display] &b转增给其他玩家"
      # [server] 表示命令以控制台身份执行
      # [player] 表示命令以玩家身份执行
      commands:
        - "[chat_wait] &b请输入玩家名称.:[player] !color pwarp setowner %warp% %value%\n[server] %cmd% open mywarps -view %viewer% -player %player%"
        - "[close]"
      back: false
