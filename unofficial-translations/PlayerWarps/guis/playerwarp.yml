# PlayerWarps, 插件作者 Olzie-12
# https://www.spigotmc.org/resources/115286/
# 我们也有可以提供帮助的 Discord 聊天群组: https://olziedev.com/discord 和插件维基 https://docs.olziedev.com/projects/playerauctions
# 如果你找到任何 BUG, 我很乐意第一时间修复它们 :)
# 为爱发电

pwarp:
  # 是否启用该菜单？
  enabled: true
  # 该界面的名称是什么?
  name: "playerwarp"
  # 该界面的显示标题是什么? (可以使用彩色代码) 内建变量 "[category]" 仅在启用对应功能后生效。
  title: "&b&l玩家地标 - [category] ([page]/[pages])"
  # 界面的大小? (填入 9 的倍数, 最大为 54)
  size: 54
  # /pwarp open 是否能直接打开这个界面？
  override-pwarp: true
  # 打开该界面的时候执行哪些额外的操作?
  open-actions: []
  # 关闭该界面的时候执行哪些额外的操作?
  close-actions: []
  # 是否在无法翻页的情况下隐藏翻页按钮。例如，如果你在第一页，那么不显示向前翻页的按钮。
  # 你也可以用一个物品替代原本的翻页按钮，这样它只会在无法翻页时显示。
  show-needed-page-items: false
  # Should the GUI hide server warps?
  hide-server-warps: false
  # 物品不会出现在本菜单界面的哪些格子中?
  # 若你想在界面中央加入一些元素的话会很有用.
  blacklisted-slots: ["48", "50"]

  # 通过界面搜索地标
  search:
    # 是否启用这个功能？
    # 需要安装 ProtocolLib 才可以生效。
    enabled: true
    # 界面的标题是什么？
    title: "&b&l搜索 [search] - [category] ([page]/[pages])" 
    # 告示牌的预设内容是什么？
    # %search% 为玩家输入的地标名称，因此请确保这一行没有其他文本。
    # 如果没有包含这个内建变量，插件会假设第一行是输入框。无视彩色代码。
    lines:
      - "%search%"
      - "----------------"
      - "请输入玩家名称."
      - "----------------"
    # 用于展开搜索界面的物品名称. 仅支持填入告示牌.
    material: OAK_SIGN

    item:
      material: OAK_SIGN
      data: 0
      name: "&b搜索"
      lore:
        - "&d点击&b搜索指定地标."
        - " "
        - "&b你可以搜索地标的这些信息:"
        - "&d* 完整名称"
        - "&d* 地标名称"
      slot: 46
      amount: 1
      glowing: false
  icon:
    # 默认标签是否为玩家自己的头颅？
    skull: true
    # 如果上述选项为 false，是否继承分类界面的图标？（只复制材料）
    # 若地标没有所属分类且没有设置自定义图标，那么会显示下面的图标。
    inherit-category-icon: false
    # 若上述选项禁用，你可以在这里设置默认物品。
    # 物品的材料是什么？
    material: DIAMOND_AXE
    # 物品的 ID 是什么？
    data: 0
    # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
    #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODcyZDM0MWQ3N2RiZGU2ZDUzZGFkNjFiZjE5MjUyNGRiZGI5NmFmMTM1OGUwNzQ4ZmVlYTE0ODFiMWY4In19fQ== - 头颅材质
    #owner: Warp - 头颅对应的玩家名称

    # 如果你的子服和群组都是离线模式，那么服务器会使用离线 UUID，这会导致头颅无法显示。
    # 另外，你可以将其设置为 true，强制头颅使用名称，但需要注意的是，Spigot 可能兼容性不佳，且我们无人使用。
    # 头颅这个东西真的很难搞 :(
    use-names: false

    # 菜单界面中头颅的名称。
    name: "&b[warp_display]"
     # 支持多行描述
     # 如果你正在使用 SQL，你还可以通过变量 [server] 返回玩家所在服务器
    # 你也可以使用 [world_type] 内建变量，它的返回内容可以在 config.yml 中编辑
    lore:
      - "&b[banned]"
      - "&b[safe]"
      - "&b[favourite]"
      - " "
      - "&b拥有者: &d[owner]"
      - "&b位置: &d[world], [location]"
      - "&b访问量: &d[visits]"
      - "&b描述: "
      - "&d[desc]"
      - "&b创建时间: &d[date]"
      - "&b所属分类: &d[category]"
      - "&b评分: &d[rates]"
      - "&b平均评分: &d[rates_average] &7(&e[rates_stars]&7)"
      - "&b传送价格: &d[cost]"
      - "[tags]"
      - " "
      - "&d右键点击&b了解详情."
    # 物品是否自带附魔光效？
    glowing: false

    locked:
      # 如果地标在菜单中锁定，是否仍然显示它？
      enabled: false
      # 如果启用上述选项，是否改变地标的图标？
      icon-changed: false

      # 如果上述选项启用，那么改变后的图标显示内容是什么？
      icon:
        material: BARRIER
        name: "&b[warp_display]"
        lore:
          - "&b[banned]"
          - "&b[safe]"
          - "&b[favourite]"
          - " "
          - "&b拥有者: &d[owner]"
          - "&b位置: &d[world], [location]"
          - "&b访问量: &d[visits]"
          - "&b描述: "
          - "&d[desc]"
          - "&b创建时间: &d[date]"
          - "&b所属分类: &d[category]"
          - "&b评分: &d[rates]"
          - "&b平均评分: &d[rates_average] &7(&e[rates_stars]&7)"
          - "&b传送价格: &d[cost]"
          - "[tags]"
          - " "
          - "&d右键点击&b了解详情."
    # 可用的物品标志：https://javadocs.olziedev.com/spigot/latest/org/bukkit/inventory/ItemFlag.html
    item-flags:
      - HIDE_ATTRIBUTES

    # 内建变量 "[safe]" 会在传送目的地安全时显示如下内容
    warp-safe: "&b点击传送至 &d[warp_display]"
    # 内建变量 "[safe]" 会在传送目的地不安全时显示如下内容
    warp-not-safe: "&c目的地不安全, 再次点击确认传送至地标 &d[warp_display]"
    # [rates_stars] 中表示满格的符号是什么?
    rates-stars: "&e⭐"
    # [rates_stars] 中表示空格的符号是什么?
    empty-rates-stars: "&f⭐"
    # 地标传送不收费时显示什么？
    no-warp-cost: "&c免费"
    # 地标传送收费时显示什么？
    has-warp-cost: "[cost]"
    # 内建变量 "[banned]" 会在玩家被封禁时显示如下内容
    player-banned: "&c你已被该地标封禁, 剩余时间 [timeleft]"
    # 内建变量 "[banned]" 会在玩家未被封禁时显示如下内容
    player-not-banned: ""
    # 内建变量 "[timeleft]" 会在玩家被封禁时显示剩余时间
    time-left: "&c直到 &4[timeleft]"
    # 内建变量 "[timeleft]" 会在玩家被永久封禁时显示剩余时间
    time-not-left: "永久封禁."
    # 内建变量 "[favourite]" 在地标处于玩家喜欢列表中显示如下内容
    warp-favourite: "&a你已将地标设为喜欢."
    # 内建变量 "[favourite]" 在地标不处于玩家喜欢列表中显示如下内容
    warp-not-favourite: ""
    # 内建变量 "[has_visited]" 会在玩家到访过地标时显示如下内容. (仅在足迹菜单启用时可用)
    has-visited: "你已到访过此地标."
    # 内建变量 "[has_visited]" 会在玩家尚未到访过地标时显示如下内容
    has-not-visited: "你尚未到访过此地标."
    # 内建变量 "[tags]" 会在地标没有标签时显示如下内容
    no-tags: ""
    # 内建变量 "[tags]" 会在地标有标签时显示如下内容
    tag-format: "&b[tag]: &d[value]"
    # 玩家点击地标时执行什么命令？
    commands: []
    # 如果禁用了访问编辑菜单，右键点击也会传送玩家
    # 是否需要禁用右键点击功能，只允许左键点击传送玩家？
    # 如果需要添加触发命令时这个功能会很有用。
    disable-right-click: false

  clickable-items:
    next-page:
      # 此为翻页物品的名称
      # 若你想要禁用这些物品, 只需将它设置为 "AIR"
      name: "&b下一页"
      # 此为翻页物品的材料名称. 有效材料名称可见此: https://javadocs.olziedev.com/spigot/latest/org/bukkit/Material.html
      material: ARROW
      data: 0
      lore:
        - "&d点击&b翻到下一页."
      slot: 50
      amount: 1
      glowing: false
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWE0ZjY4YzhmYjI3OWU1MGFiNzg2ZjlmYTU0Yzg4Y2E0ZWNmZTFlYjVmZDVmMGMzOGM1NGM5YjFjNzIwM2Q3YSJ9fX0= - 头颅材质
      #owner: Next - 头颅对应玩家名称
    previous-page:
      name: "&b上一页"
      material: BARRIER
      data: 0
      lore:
        - "&d点击&b翻到上一页."
      slot: 48
      amount: 1
      glowing: false
    refresh:
      name: "&b刷新"
      material: SUNFLOWER
      data: 0
      lore:
        - "&d点击&b刷新界面."
      slot: 49
      amount: 1
      glowing: false
      cooldown: 3
    category:
      # 如果启用了分类菜单，那么这个按钮会显示在主菜单中。
      name: "&b分类菜单"
      material: BOOK
      data: 0
      lore:
        - "&d点击&b返回分类菜单."
      slot: 45
      amount: 1
      glowing: false
    category-swapper:
      # 如果启用了分类菜单，那么这个按钮会显示在主菜单中。
      name: "&b分类"
      material: BOOK
      data: 0
      lore:
        - "&d点击&b切换到不同分类."
        - " "
        - "%categories%"
      slot: 51
      amount: 1
      glowing: false
      current-category: "&b%category%"
      other-category: "&d%category%"
    mywarps:
      # 如果启用了地标列表，那么这个按钮会显示在主菜单中。
      name: "&b我的地标"
      material: ENDER_PEARL
      data: 0
      lore:
        - "&d点击&b浏览你的地标列表."
      slot: 53
      amount: 1
      glowing: false
    sort:
      name: "&b排序"
      material: HOPPER
      data: 0
      lore:
        - "&d点击&b按指定顺序为界面中的地标进行排序."
        - "&b当前: &d%sort%"
      slot: 52
      amount: 1
      glowing: false

  items:
    1:
      # 物品的名称。
      name: " "
      # 物品的材料。若需要禁用，请将其设置为 AIR
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      # 物品的数据值。
      data: 3
      # 可以添加多行描述！
      # lore:
      #   - "&b这是一片玻璃板."
      slot: [45, 47, 51, 53]
      # 物品的堆叠数量。
      amount: 1
      # 点击时执行的命令。
      # [server] 表示以控制台身份执行
      # [player] 表示以玩家身份执行
      # commands:
      #   - "[server] msg %player% 你点击了这个物品！"
      glowing: false
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTZmOGFmYjI3YmFmYzc3YzJiODI1OTljMmY3YjhmMWY2ODMxMGU2YWE5MDRmMDUxYjA3YWIxYzJiNmIifX19 - 头颅材质
      #owner: Glass - 头颅对应玩家名称
    2:
      name: " "
      material: MAGENTA_STAINED_GLASS_PANE
      data: 2
      slot: [46, 52]
      amount: 1
