setwarp:
  # 是否启用这个菜单界面？
  enabled: false
  # 这个界面的名称是什么？
  name: "setwarp"
  # 该界面的显示标题是什么? (可以使用彩色代码)
  title: "&b&l地标设置"
  # 界面的大小? (填入 9 的倍数, 最大为 54)
  size: 27
  # 打开该界面的时候执行哪些额外的操作?
  open-actions: []
  # 关闭该界面的时候执行哪些额外的操作?
  close-actions: []

  clickable-items:
    name:
      name: "&b设置名称"
      material: OAK_SIGN
      data: 0
      lore:
        - "&d点击&b设置地标名称."
        - " "
        - "&7当前名称: &b[warp_display]"
      slot: 4
      amount: 1
      glowing: false
      sign:
        lines:
          - "%search%"
          - "----------------"
          - "请输入新的地标名称"
          - "----------------"
    description:
      name: "&b设置描述"
      material: PAPER
      data: 0
      lore:
        - "&d点击&b修改地标的描述."
        - " "
        - "&7当前描述: &b[desc]"
      slot: 11
      amount: 1
      glowing: false
      message: "&b请输入地标描述."
    cost:
      name: "&b设置地标价格"
      material: GOLD_INGOT
      data: 0
      lore:
        - "&d点击&b设置地标价格."
        - " "
        - "&7当前价格: &b[cost_set]"
      slot: 13
      amount: 1
      glowing: false
      sign:
        lines:
          - "%search%"
          - "----------------"
          - "请输入价格"
          - "----------------"
    category:
      name: "&b设置分类"
      material: BOOK
      data: 0
      lore:
        - "&d左键点击&b为地标添加分类."
        - "&d右键点击&b为地标移除分类."
        - " "
        - "&7当前类别: &b[category]"
      slot: 15
      amount: 1
      glowing: false
      sign:
        lines:
          - "%search%"
          - "----------------"
          - "请输入分类名称"
          - "----------------"
    set:
      name: "&b设置地标"
      material: LIME_WOOL
      data: 5
      lore:
        - "&d点击&b花费 &d[set_cost]&b 创建地标!"
      slot: 22
      amount: 1
      glowing: false

  items:
    # 放在界面装饰的物品
    1:
      # 物品的名称。
      name: " "
      # 物品的材料。
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      # 物品的数据值。
      data: 3
      # 可以添加多行描述！
      # 示例配置：
      # lore:
      #   - "&b这是一片玻璃板."
      slot: [0, 2, 6, 8, 18, 20, 24, 26]
      # 物品的堆叠数量。
      amount: 1
      # 点击时执行的命令。
      # [server] 表示以控制台身份执行
      # [player] 表示以玩家身份执行
      # commands:
      #   - "[server] msg %player% 你点击了这个物品！"
      glowing: false
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTZmOGFmYjI3YmFmYzc3YzJiODI1OTljMmY3YjhmMWY2ODMxMGU2YWE5MDRmMDUxYjA3YWIxYzJiNmIifX19 - 头颅材质
      #owner: Glass - 头颅对应玩家名称
    2:
      name: " "
      material: MAGENTA_STAINED_GLASS_PANE
      data: 2
      slot: [1, 3, 5, 7, 9, 17, 19, 21, 23, 25]
      amount: 1