set-confirm:
  # 启用分类界面表示玩家可以分类排序地标.
  enabled: false
  # 该界面的名称是什么?
  name: "set-confirm"
  # 该界面的显示标题是什么? (可以使用彩色代码)
  title: "&b&l确认设置"
  # 界面的大小? (填入 9 的倍数, 最大为 54)
  size: 27
  # 打开该界面的时候执行哪些额外的操作?
  open-actions: []
  # 关闭该界面的时候执行哪些额外的操作?
  close-actions: []

  clickable-items:
    accept:
      # 如果不需要显示这样的格子，请将材料设置为 "AIR"。
      name: "&a确认设置"
      # 此为翻页物品的材料名称. 有效材料名称可见此: https://javadocs.olziedev.com/spigot/latest/org/bukkit/Material.html
      material: LIME_WOOL
      data: 5
      lore:
        - "&d点击&b花费 &d[set_cost]&b 创建名为 &d[warp_display]&b 的地标!"
      amount: 1
      slot: 11
      glowing: false
      # 仅在头颅种类为 SKULL_ITEM 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWE0ZjY4YzhmYjI3OWU1MGFiNzg2ZjlmYTU0Yzg4Y2E0ZWNmZTFlYjVmZDVmMGMzOGM1NGM5YjFjNzIwM2Q3YSJ9fX0= - 头颅材质
      #owner: Next - 头颅对应玩家名称
    deny:
      name: "&c取消设置"
      material: RED_WOOL
      data: 14
      lore:
        - "&c点击取消创建."
      amount: 1
      slot: 15
      glowing: false

  items:
    # 放在界面装饰的物品
    1:
      # 物品的名称。
      name: " "
      # 物品的材料。
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      # 物品的数据值。
      data: 3
      # 可以添加多行描述！
      # 示例配置：
      # lore:
      #   - "&b这是一片玻璃板."
      slot: [0, 2, 4, 6, 8, 18, 20, 22, 24, 26]
      # 物品的堆叠数量。
      amount: 1
      # 点击时执行的命令。
      # [server] 表示以控制台身份执行
      # [player] 表示以玩家身份执行
      # commands:
      #   - "[server] msg %player% 你点击了这个物品！"
      glowing: false
      # 仅在头颅种类为 SKULL_ITEM 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTZmOGFmYjI3YmFmYzc3YzJiODI1OTljMmY3YjhmMWY2ODMxMGU2YWE5MDRmMDUxYjA3YWIxYzJiNmIifX19 - 头颅材质
      #owner: Glass - 头颅对应玩家名称
    2:
      name: " "
      material: MAGENTA_STAINED_GLASS_PANE
      data: 2
      slot: [1, 3, 5, 7, 9, 17, 19, 21, 23, 25]
      amount: 1
