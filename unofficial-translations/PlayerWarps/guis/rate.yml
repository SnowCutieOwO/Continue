# PlayerWarps, 插件作者 Olzie-12
# https://www.spigotmc.org/resources/115286/
# 我们也有可以提供帮助的 Discord 聊天群组: https://olziedev.com/discord 和插件维基 https://docs.olziedev.com/projects/playerauctions
# 如果你找到任何 BUG, 我很乐意第一时间修复它们 :)
# 为爱发电

rate:
  # 是否启用该菜单？
  enabled: true
  # 该界面的名称是什么?
  name: "rate"
  # 该界面的显示标题是什么? (可以使用彩色代码)
  title: "&b&l地标评价 - ([page]/[pages])"
  # 界面的大小? (填入 9 的倍数, 最大为 54)
  size: 54
  # 打开该界面的时候执行哪些额外的操作?
  open-actions: []
  # 关闭该界面的时候执行哪些额外的操作?
  close-actions: []
  # 是否在无法翻页的情况下隐藏翻页按钮。例如，如果你在第一页，那么不显示向前翻页的按钮。
  # 你也可以用一个物品替代原本的翻页按钮，这样它只会在无法翻页时显示。
  show-needed-page-items: false
  # 列入黑名单的格子不会在菜单界面中显示。
  # 如果需要在菜单中间添加空格且不希望它被物品填满，那么可以将格子序号填入这里。
  blacklisted-slots:
    - ""

  # 通过菜单搜索玩家
  search:
    # 是否启用这个功能？
    # 需要安装 ProtocolLib 才可以生效。
    enabled: true
    # 界面的标题是什么？
    title: "&b&l搜索 [search] - ([page]/[pages])"
    # 告示牌中的预设文本内容
    # %search% 表示输入搜索的关键词，确保这个变量所在行没有其他文本
    # 如果这里没有变量，插件会假设第一行是玩家输入的搜索词。颜色代码在这里不会生效。
    lines:
      - "%search%"
      - "----------------"
      - "请输入玩家名称."
      - "----------------"
    # 用于展开搜索界面的物品名称. 仅支持填入告示牌.
    material: OAK_SIGN

    item:
      material: OAK_SIGN
      data: 0
      name: "&b搜索"
      lore:
        - "&d点击&b搜索指定玩家."
      slot: 45
      amount: 1
      glowing: false


  icon:
    # 默认标签是否为玩家自己的头颅？
    skull: true
    # 若上述选项禁用，你可以在这里设置默认物品。
    # 物品的材料是什么？
    material: DIAMOND_AXE
    # 物品的 ID 是什么？
    data: 0
    # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
    #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODcyZDM0MWQ3N2RiZGU2ZDUzZGFkNjFiZjE5MjUyNGRiZGI5NmFmMTM1OGUwNzQ4ZmVlYTE0ODFiMWY4In19fQ== - 头颅材质
    #owner: Warp - 头颅对应的玩家名称

    # 菜单界面中头颅的名称。
    name: "&b[rater]'s rate"
    # 支持多行描述
    # 如果你正在使用 SQL，你还可以通过变量 [server] 返回玩家所在服务器
    # 你也可以使用 [world_type] 内建变量，它的返回内容可以在 config.yml 中编辑
    lore:
      - "[delrate]"
      - "&b玩家: &d[rater]"
      - "&b评分: &d[rate]"
      - "&b星级: &d[rate_stars]"
      - "&b描述: "
      - "&d[desc]"
    # 物品是否自带附魔光效？
    glowing: false

    # 可用的物品标志：https://javadocs.olziedev.com/spigot/latest/org/bukkit/inventory/ItemFlag.html
    item-flags:
      - HIDE_ATTRIBUTES
    # 内建变量 "[delrate]" 会在玩家有权限移除这个评分时显示如下内容.
    del-rate: "&d点击&b删除此评分."
    # 内建变量 "[delrate]" 会在玩家没有权限移除这个评分时显示如下内容.
    del-not-rate: ""
    # 玩家点击评分时一并执行什么命令？
    commands: []

  clickable-items:
    next-page:
      # 此为翻页物品的名称
      # 若你想要禁用这些物品, 只需将它设置为 "AIR"
      name: "&b下一页"
      # 此为翻页物品的材料名称. 有效材料名称可见此: https://javadocs.olziedev.com/spigot/latest/org/bukkit/Material.html
      material: ARROW
      data: 0
      lore:
        - "&d点击&b翻到下一页."
      slot: 50
      amount: 1
      glowing: false
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWE0ZjY4YzhmYjI3OWU1MGFiNzg2ZjlmYTU0Yzg4Y2E0ZWNmZTFlYjVmZDVmMGMzOGM1NGM5YjFjNzIwM2Q3YSJ9fX0= - 头颅材质
      #owner: Next - 头颅对应玩家名称
    previous-page:
      name: "&b上一页"
      material: BARRIER
      data: 0
      lore:
        - "&d点击&b翻到上一页."
      slot: 48
      amount: 1
      glowing: false

  items:
    1:
      # 物品的名称。
      name: " "
      # 物品的材料。若需要禁用，请将其设置为 AIR
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      # 物品的数据值。
      data: 3
      # 可以添加多行描述！
      # lore:
      #   - "&b这是一片玻璃板."
      slot: [45, 47, 51, 53]
      # 物品的堆叠数量。
      amount: 1
      # 点击时执行的命令。
      # [server] 表示以控制台身份执行
      # [player] 表示以玩家身份执行
      # commands:
      #   - "[server] msg %player% 你点击了这个物品！"
      glowing: false
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTZmOGFmYjI3YmFmYzc3YzJiODI1OTljMmY3YjhmMWY2ODMxMGU2YWE5MDRmMDUxYjA3YWIxYzJiNmIifX19 - 头颅材质
      #owner: Glass - 头颅对应玩家名称
    2:
      name: " "
      material: MAGENTA_STAINED_GLASS_PANE
      data: 2
      slot: [46, 52]
      amount: 1
    3:
      name: "&b返回"
      material: BOOK
      data: 0
      lore:
        - "&d点击&b返回."
      slot: 49
      amount: 1
      glowing: false
      commands:
        - "[server] %cmd% open visitedit -warp %warp% -player %player%"
