category:
  # 启用分类界面表示玩家可以分类排序地标.
  enabled: true
  # If you don't want the category menu to be disabled entirely, but you don't want it to open up on prompt
  # then you can select the default category it'll open up or set it to main if you want the main menu.
  prompt-category: main
  # 该界面的名称是什么?
  name: "category"
  # 该界面的显示标题是什么? (可以使用彩色代码)
  title: "&b&lPlayer地标"
  # 界面的大小? (填入 9 的倍数, 最大为 54)
  size: 54
  # 打开该界面的时候执行哪些额外的操作?
  open-actions: []
  # 关闭该界面的时候执行哪些额外的操作?
  close-actions: []
  # 地标默认处于的分类是什么？
  default: "other"
  # 无权限进入分类时的显示内容
  no-permission:
    # 如果玩家没有权限进入分类，是否将物品替换为权限不足的样式？
    enabled: true
    item:
      # 如果要隐藏物品，请将其设置为 AIR。
      name: "&c权限不足!"
      material: BARRIER
      data: 0
      lore:
        - "&c你不能浏览这个分类."
      amount: 1
  # 是否允许插件为每个分类自动创建子命令？输入 /pw <类别名称> 命令即可打开分类
  register-category-commands: false

  sponsor:
    # 是否启用捐赠者栏位的地标传送？
    enabled: true
    # 启用后，捐赠者地标是否会显示在玩家地标主界面？
    appear-playerwarp: false
    # 当玩家用 "pw.admin.sponsor" 权限取消捐赠者地标，是否将钱退还？
    # 仅当经济类型设置为钱而非实体物品时有效。
    cancel-refund: false
    # 地标收到赞助时显示的样式。
    item:
      # 玩家通过 /pwarp icon 命令打开的界面是否显示自定义图标？
      show-custom-icon: true
      name: "&b[warp_display]"
      lore:
        - "&b[delsponsor]"
        - " "
        - "&b拥有者: &d[owner]"
        - "&b位置: &d[world], [location]"
        - "&b访问量: &d[visits]"
        - "&b介绍: "
        - "&d[desc]"
        - "&b传送价格: &d[cost]"
        - " "
        - "&b时间: &d[time]"
#      override-item:
#        material: DIAMOND
#        data: 0

      # "[banned]" 变量会在玩家被封禁时显示如下内容
      player-banned: "&c你已被地标封禁, 时长为 [timeleft]"
      # "[banned]" 变量会在玩家没有被封禁时显示如下内容
      player-not-banned: ""
      # "[timeleft]" 变量会在玩家被封禁时显示剩余时长
      time-left: "&cuntil &4[timeleft]"
      # "[delsponsor]" 变量会在玩家没有权限删除捐赠者地标时显示如下内容.
      del-sponsor: "&dShift+Right&b 点击移除该捐赠者地标.\n[safe]"
      # "[delsponsor]" 变量会在玩家没有权限删除非捐赠者地标时显示如下内容.
      del-not-sponsor: "&c[safe]"

    # 玩家处于冷却时显示的物品样式.
    cooldown:
      name: "&c捐赠者冷却"
      material: BARRIER
      data: 0
      lore:
        - "&c你正处于冷却状态! 剩余 [cooldown]."
      amount: 1

  leaderboard:
    # 是否启用排行榜？基本上会显示近几日的最佳地标，不过并不是实时刷新。
    # 即使你启用了分世界设置，这个排行榜也不会受到影响，它只会照常显示。
    enabled: true
    # 启用后，是否在玩家地标主界面显示排行榜？
    appear-playerwarp: false
    # 排行榜的排序方式是什么？
    # 可用选项：
    # - HIGHEST_VISITS = 浏览量从高到低
    # - LOWEST_VISITS = 浏览量从低到高
    # - ALPHABETICAL = 字母顺序 A-Z
    # - OLDEST_DATE = 创建时间从早到晚
    # - NEWEST_DATE = 创建时间从晚到早
    # - RATES = 评分从高到低
    # - RATES_AVERAGE = 平均评分从高到低
    # - RANDOM = 每 X 秒随机显示
    # - FAVOURITE_COUNT = “标为喜欢”数量从高到低
    # - PURGED_HIGHEST_VISITS = 访问量从高到低，定时清理
    # - PURGED_LOWEST_VISITS = 访问量从低到高，定时清理
    leaderboard-sort: RATES_AVERAGE
    # 排行榜更新间隔？（单位为天）
    update-days: 7
    # 排行榜物品显示在界面里的位置？
    # 如果添加新格子，排行榜会在更新后自适应。
    leaderboard-slots: ["37", "38", "39", "40", "41", "42", "43"]
    # 锁定地标是否参与排行？
    # 这个选项只会在排行榜更新后生效。
    count-locked: false
    # 被捐赠地标显示的样式
    item:
      # 是否显示玩家通过命令 /pwarp icon 设置的自定义地标图标？
      show-custom-icon: true
      name: "&b[warp_display] #[position]"
      lore:
        - "&b拥有者: &d[owner]"
        - "&b位置: &d[world], [location]"
        - "&b访问量: &d[visits]"
        - "&b介绍: "
        - "&d[desc]"
        - "&b传送价格: &d[cost]"

    # 排行榜条目为空时显示的内容。
    no-entry-item:
      name: "&c无排行榜条目"
      material: BARRIER
      data: 0
      lore:
        - "&c#[position] 名次没有内容."
      amount: 1

  items:
    # 放在界面装饰的物品
    1:
      # 物品的名称。
      name: "&bFavourite"
      # 物品的材料。
      material: NETHER_STAR
      # 物品的数据值。
      data: 0
      # 物品的描述。
      lore:
        - "&d点击&b 浏览你喜欢的地标."
      # 可以添加多行描述！
      # 示例配置：
      # lore:
      #   - "&b这是一片玻璃板."
      slot: 0
      # 物品的堆叠数量。
      amount: 1
      # 点击时执行的命令。
      # [server] 表示以控制台身份执行
      # [player] 表示以玩家身份执行
      commands:
        - "[player] %cmd% open favourite"
      glowing: false
      all: true
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTZmOGFmYjI3YmFmYzc3YzJiODI1OTljMmY3YjhmMWY2ODMxMGU2YWE5MDRmMDUxYjA3YWIxYzJiNmIifX19 - 头颅材质
      #owner: Glass - 头颅对应玩家名称
    2:
      name: " "
      material: MAGENTA_STAINED_GLASS_PANE
      data: 2
      slot: [1, 3, 5, 7, 9, 17, 19, 21, 23, 25, 27, 35, 45, 47, 49, 51, 53]
      amount: 1
    3:
      name: " "
      material: LIGHT_BLUE_STAINED_GLASS_PANE
      data: 3
      slot: [2, 6, 18, 20, 22, 24, 26, 28, 34, 36, 44, 46, 48, 50, 52]
      amount: 1
    4:
      name: "&bVisited地标"
      material: ENDER_EYE
      data: 0
      lore:
        - "&d点击&bto view your visited地标."
      slot: 8
      amount: 1
      commands:
        - "[player] %cmd% open visitedwarps"

  category-items:
    # What are the items to click on to go to a certain category?
    # The first category that is used here will be counted as the ALL category where ALL the warps are displayed. You can change the category names if you want.

    all: # This is the name of category.
      displayname: "All" # This is the display name of the category. This is what will be used to show to the player.
      name: "&bAll地标"
      material: BOOK
      data: 0
      lore:
        - "&d点击&b浏览所有warps."
      slot: 4
      amount: 1
      # 点击时执行的命令。
      # [server] 表示以控制台身份执行
      # [player] 表示以玩家身份执行
      #commands:
      #  - "[server] msg %player% 你点击了这个物品！"
      glowing: false
      # 仅在头颅种类为 PLAYER_HEAD 且数据值为 3 时有效!
      #texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzIzZDFjNDVmNDlkZTllOGE4YTEzZDViOWMyYTU4ZDYxZjcyNTljZDQ2OGYzM2M0NzI0Njg2Y2FlODlhOTMifX19 - 头颅纹理
      #owner: All - 头颅拥有者
      # 分类菜单下的所有地标默认传送价格都为 50。
      #teleport-price: 50
    houses:
      displayname: "Houses"
      name: "&b房屋地标"
      material: OAK_PLANKS
      data: 0
      lore:
        - "&d点击&b浏览所有房屋地标."
      slot: 11
      amount: 1
    shops:
      displayname: "Shops"
      name: "&b商店地标"
      material: CHEST
      data: 0
      lore:
        - "&d点击&b浏览所有商店地标."
      slot: 12
      amount: 1
      permission: pw.view.shop
      teleport-price: -1
      purge-time: 40
      remove-days-time: 40
    farms:
      displayname: "Farms"
      name: "&b农场地标"
      material: DIAMOND_HOE
      data: 0
      lore:
        - "&d点击&b浏览所有农场地标."
      slot: 13
      amount: 1
    pvp:
      displayname: "PvP"
      name: "&bPVP 地标"
      material: DIAMOND_SWORD
      data: 0
      lore:
        - "&d点击&b浏览所有 PVP 地标."
      slot: 14
      amount: 1
    other:
      displayname: "Other"
      name: "&b其他地标"
      material: PAPER
      data: 0
      lore:
        - "&d点击&b浏览所有其他地标."
      slot: 15
      amount: 1

